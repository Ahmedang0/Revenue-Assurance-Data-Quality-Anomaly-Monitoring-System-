[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revenue-assurance-dq"
version = "0.1.0"
description = "Revenue assurance: rule-based data quality checks + statistical anomaly monitoring (z-score, IQR, Isolation Forest) for a subscription billing pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ahmed Elhassan" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "psycopg2-binary>=2.9",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
revenue-assurance = "revenue_assurance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
